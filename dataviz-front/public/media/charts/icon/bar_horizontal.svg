<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" preserveAspectRatio="xMidYMid meet"
  version="1.0">
  <title>Graphique à bar groupées</title>
  <g>
    <g>
      <rect stroke-width="0" stroke="#000" height="15" width="80" y="10" x="0" fill="#e5e5e5"></rect>
      <rect stroke-width="0" stroke="#000" height="15" width="60" y="30" x="0" fill="#999999"></rect>
    </g>
    <g>
      <rect stroke-width="0" stroke="#000" height="15" width="50" y="60" x="0" fill="#e5e5e5"></rect>
      <rect stroke-width="0" stroke="#000" height="15" width="90" y="80" x="0" fill="#999999"></rect>
    </g>
    <g>
      <line stroke-width="3" stroke="#000" y2="99" x2="1" y1="99" x1="99"></line>
      <line stroke-width="3" stroke="#000" y2="99" x2="1" y1="1" x1="1"></line>
    </g>
  </g>
</svg>