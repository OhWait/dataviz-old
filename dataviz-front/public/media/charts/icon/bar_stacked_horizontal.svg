<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" preserveAspectRatio="xMidYMid meet"
  version="1.0">
  <title>Graphique à barres empilées</title>
  <g>
    <g>
      <rect stroke="#000" stroke-width="0" height="15" width="40" y="25" x="0" fill="#e5e5e5"></rect>
      <rect stroke="#000" stroke-width="0" height="15" width="20" y="25" x="40" fill="#999999"></rect>
    </g>
    <g>
      <rect stroke="#000" stroke-width="0" height="15" width="50" y="65" x="0" fill="#e5e5e5"></rect>
      <rect stroke="#000" stroke-width="0" height="15" width="20" y="65" x="50" fill="#999999"></rect>
    </g>
    <g>
      <line stroke-width="3" stroke="#000" y2="99" x2="1" y1="99" x1="99"></line>
      <line stroke-width="3" stroke="#000" y2="99" x2="1" y1="1" x1="1"></line>
    </g>
  </g>
</svg>