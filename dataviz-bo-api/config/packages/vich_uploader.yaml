vich_uploader:
    db_driver: orm
    storage: file_system
    mappings:
        provider_image:
            uri_prefix: /media
            upload_destination: "/var/shared_data"
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
            inject_on_load: false
            delete_on_update: true
            delete_on_remove: true
