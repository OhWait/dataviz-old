doctrine:
    dbal:
        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'
        default_connection: default

        connections:
            default:
                url: '%env(resolve:DATABASE_URL_API)%'
                profiling_collect_backtrace: '%kernel.debug%'
                use_savepoints: true
                # only watch tables in public schema

                # IMPORTANT: You MUST configure your server version,
                # either here or in the DATABASE_API_URL env var (see .env file)
                server_version: "%env(resolve:POSTGRES_VERSION)%"
            pool:
                url: '%env(resolve:DATABASE_URL_POOL)%'
                profiling_collect_backtrace: '%kernel.debug%'
                use_savepoints: true
    orm:
        default_entity_manager: default
        enable_lazy_ghost_objects: true

        entity_managers:
            default:
                naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
                auto_mapping: true
                connection: default
                mappings:
                    Dataviz:
                        is_bundle: false
                        type: attribute
                        dir: '%kernel.project_dir%/src/Entity'
                        prefix: 'App\Entity'
                        alias: Dataviz

            pool:
                connection: pool

        controller_resolver:
            auto_mapping: true

when@test:
    doctrine:
        dbal:
            default_connection: default

            connections:
                default:
                    dbname_suffix: '_test%env(default::TEST_TOKEN)%'
                    url: '%env(resolve:DATABASE_URL_API)%'
                    profiling_collect_backtrace: '%kernel.debug%'

                pool:
                    dbname_suffix: '_test%env(default::TEST_TOKEN)%'
                    url: '%env(resolve:DATABASE_URL_POOL)%'
                    profiling_collect_backtrace: '%kernel.debug%'

when@prod:
    doctrine:
        orm:
            auto_generate_proxy_classes: false
            proxy_dir: '%kernel.build_dir%/doctrine/orm/Proxies'
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
